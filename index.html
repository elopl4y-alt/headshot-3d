<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎯 HEADSHOT 3D | Шутер с настройками управления</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #0f0;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 #000;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            font-family: monospace;
        }

        .ui span {
            color: #ffaa00;
        }

        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 200;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #0f0;
        }

        .crosshair::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }

        .crosshair::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }

        .ammo {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            color: #0f0;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
            border: 1px solid #0f0;
        }

        .health-bar {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 250px;
            height: 25px;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #0f0;
            pointer-events: none;
            z-index: 100;
        }

        .health-fill {
            width: 100%;
            height: 100%;
            background: #ff0000;
            transition: width 0.2s;
        }

        .settings-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #0f0;
            z-index: 150;
            font-size: 0.8rem;
            min-width: 180px;
            pointer-events: auto;
            font-family: monospace;
        }

        .settings-panel h3 {
            color: #0f0;
            margin-bottom: 10px;
            text-align: center;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #fff;
        }

        .setting label {
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0f0;
        }

        .controls-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 8px;
            color: #888;
            font-size: 0.7rem;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000d;
            backdrop-filter: blur(10px);
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #f00;
            z-index: 1000;
            color: white;
            font-family: monospace;
        }

        .game-over h2 {
            color: #f00;
            margin-bottom: 20px;
        }

        .game-over button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            border-radius: 10px;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        .score-popup {
            position: fixed;
            animation: floatUp 0.5s ease-out forwards;
            pointer-events: none;
            z-index: 300;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 1px 1px 0 #000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
    </style>
</head>
<body>
    <div class="ui">
        🔫 УБИЙСТВ: <span id="killCount">0</span>
    </div>
    <div class="health-bar">
        <div class="health-fill" id="healthFill"></div>
    </div>
    <div class="ammo" id="ammoText">
        🔫 30 / 30
    </div>
    <div class="crosshair"></div>
    
    <div class="settings-panel">
        <h3>⚙️ НАСТРОЙКИ</h3>
        <div class="setting">
            <label>🖱️ Инверсия мыши</label>
            <input type="checkbox" id="invertMouse">
        </div>
        <div class="setting">
            <label>🔄 Инверсия WASD</label>
            <input type="checkbox" id="invertWASD">
        </div>
    </div>
    
    <div class="controls-info">
        🎮 WASD — движение | 🖱️ Мышь — прицел | 🔫 ЛКМ — выстрел | R — перезарядка | 🔄 ESC — курсор | ⚙️ Настройки справа
    </div>
    
    <div id="gameOverScreen" class="game-over hidden">
        <h2>💀 GAME OVER 💀</h2>
        <p>Убийств: <span id="finalKills">0</span></p>
        <button onclick="restartGame()">🔫 НОВАЯ ИГРА</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============ НАСТРОЙКИ УПРАВЛЕНИЯ ============
        let invertMouse = localStorage.getItem('invertMouse') === 'true';
        let invertWASD = localStorage.getItem('invertWASD') === 'true';
        
        const invertMouseCheckbox = document.getElementById('invertMouse');
        const invertWASDCheckbox = document.getElementById('invertWASD');
        
        invertMouseCheckbox.checked = invertMouse;
        invertWASDCheckbox.checked = invertWASD;
        
        invertMouseCheckbox.addEventListener('change', () => {
            invertMouse = invertMouseCheckbox.checked;
            localStorage.setItem('invertMouse', invertMouse);
        });
        
        invertWASDCheckbox.addEventListener('change', () => {
            invertWASD = invertWASDCheckbox.checked;
            localStorage.setItem('invertWASD', invertWASD);
        });
        
        // ============ ИНИЦИАЛИЗАЦИЯ Three.js ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a);
        scene.fog = new THREE.FogExp2(0x0a0a2a, 0.008);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ============ УПРАВЛЕНИЕ ============
        const keyState = {
            w: false, a: false, s: false, d: false
        };
        
        let mouseX = 0, mouseY = 0;
        let pitch = 0;
        let yaw = -Math.PI / 2;
        
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keyState.w = true;
            if (key === 'a') keyState.a = true;
            if (key === 's') keyState.s = true;
            if (key === 'd') keyState.d = true;
            if (key === 'r') reload();
            if (key === 'escape') {
                document.exitPointerLock();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keyState.w = false;
            if (key === 'a') keyState.a = false;
            if (key === 's') keyState.s = false;
            if (key === 'd') keyState.d = false;
        });
        
        // Блокировка курсора
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                let deltaX = e.movementX * 0.002;
                let deltaY = e.movementY * 0.002;
                
                // ИНВЕРСИЯ МЫШИ
                if (invertMouse) {
                    deltaY = -deltaY;
                }
                
                mouseX += deltaX;
                mouseY += deltaY;
                mouseY = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, mouseY));
                yaw += deltaX;
            }
        });
        
        // ============ ОРУЖИЕ ============
        let ammo = 30;
        let maxAmmo = 30;
        let totalAmmo = 90;
        let reloading = false;
        let shootCooldown = 0;
        
        function updateAmmoUI() {
            document.getElementById('ammoText').innerHTML = `🔫 ${ammo} / ${maxAmmo} | 📦 ${totalAmmo}`;
        }
        
        function shoot() {
            if (reloading) return;
            if (shootCooldown > 0) return;
            if (ammo <= 0) {
                reload();
                return;
            }
            
            ammo--;
            shootCooldown = 10;
            updateAmmoUI();
            
            // Рэйкаст для попадания
            const raycaster = new THREE.Raycaster();
            const direction = new THREE.Vector3(Math.sin(yaw), Math.sin(mouseY), Math.cos(yaw)).normalize();
            raycaster.set(camera.position, direction);
            
            const intersects = raycaster.intersectObjects(enemies.map(e => e.mesh));
            
            if (intersects.length > 0) {
                const hit = intersects[0];
                const enemyIndex = enemies.findIndex(e => e.mesh === hit.object);
                if (enemyIndex !== -1) {
                    const enemy = enemies[enemyIndex];
                    enemy.hp--;
                    
                    createBloodEffect(hit.point);
                    
                    if (enemy.hp <= 0) {
                        scene.remove(enemy.mesh);
                        enemies.splice(enemyIndex, 1);
                        killCount++;
                        document.getElementById('killCount').textContent = killCount;
                        createScorePopup(hit.point, "+100");
                        
                        if (Math.random() < 0.3) {
                            totalAmmo += 10;
                            updateAmmoUI();
                            createScorePopup(hit.point, "+10 патронов", '#0f0');
                        }
                    } else {
                        createScorePopup(hit.point, "-" + (enemy.hp + 1), '#ffaa00');
                    }
                }
            }
            
            createMuzzleFlash();
        }
        
        function reload() {
            if (reloading) return;
            if (ammo === maxAmmo) return;
            if (totalAmmo <= 0) return;
            
            reloading = true;
            setTimeout(() => {
                const needed = maxAmmo - ammo;
                const toReload = Math.min(needed, totalAmmo);
                ammo += toReload;
                totalAmmo -= toReload;
                reloading = false;
                updateAmmoUI();
            }, 2000);
        }
        
        // ============ ВРАГИ ============
        class Enemy {
            constructor(x, z) {
                this.hp = 3;
                this.speed = 0.03;
                this.size = 0.5;
                
                const geometry = new THREE.BoxGeometry(0.8, 1.2, 0.8);
                const material = new THREE.MeshStandardMaterial({ color: 0x8B0000, emissive: 0x330000 });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.set(x, 0.6, z);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                
                const eyeGeo = new THREE.SphereGeometry(0.08);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 });
                this.leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                this.rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                this.leftEye.position.set(-0.25, 0.3, 0.45);
                this.rightEye.position.set(0.25, 0.3, 0.45);
                this.mesh.add(this.leftEye);
                this.mesh.add(this.rightEye);
                
                scene.add(this.mesh);
            }
            
            update() {
                const dx = camera.position.x - this.mesh.position.x;
                const dz = camera.position.z - this.mesh.position.z;
                const dist = Math.hypot(dx, dz);
                if (dist > 0.5) {
                    this.mesh.position.x += (dx / dist) * this.speed;
                    this.mesh.position.z += (dz / dist) * this.speed;
                }
                this.mesh.lookAt(camera.position);
            }
        }
        
        let enemies = [];
        let killCount = 0;
        let spawnTimer = 0;
        
        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 15 + Math.random() * 10;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            enemies.push(new Enemy(x, z));
        }
        
        // ============ ЭФФЕКТЫ ============
        function createBloodEffect(position) {
            const geometry = new THREE.SphereGeometry(0.1);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const blood = new THREE.Mesh(geometry, material);
            blood.position.copy(position);
            scene.add(blood);
            setTimeout(() => scene.remove(blood), 300);
        }
        
        function createMuzzleFlash() {
            const flash = new THREE.PointLight(0xffaa00, 2, 10);
            flash.position.copy(camera.position);
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 50);
        }
        
        function createScorePopup(position, text, color = '#0f0') {
            const div = document.createElement('div');
            div.className = 'score-popup';
            div.textContent = text;
            div.style.color = color;
            div.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 50) + 'px';
            div.style.top = (window.innerHeight / 2 - 50) + 'px';
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 500);
        }
        
        // ============ ЗДОРОВЬЕ ============
        let health = 100;
        let invincibleTimer = 0;
        
        function takeDamage(amount) {
            if (invincibleTimer > 0) return;
            health = Math.max(0, health - amount);
            const percent = health / 100;
            document.getElementById('healthFill').style.width = (percent * 100) + '%';
            invincibleTimer = 30;
            
            if (health <= 0) {
                gameOver();
            }
        }
        
        function gameOver() {
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalKills').textContent = killCount;
            document.exitPointerLock();
        }
        
        window.restartGame = () => {
            health = 100;
            killCount = 0;
            ammo = 30;
            totalAmmo = 90;
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];
            document.getElementById('killCount').textContent = '0';
            document.getElementById('healthFill').style.width = '100%';
            updateAmmoUI();
            document.getElementById('gameOverScreen').classList.add('hidden');
            camera.position.set(0, 1.6, 0);
            invincibleTimer = 0;
            for (let i = 0; i < 3; i++) spawnEnemy();
        };
        
        // ============ МИР ============
        const floorGeometry = new THREE.PlaneGeometry(50, 50);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        const gridHelper = new THREE.GridHelper(50, 20, 0x44aa44, 0x336633);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);
        
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a4a });
        const walls = [
            { x: 0, z: -25, w: 50, h: 5, d: 1 },
            { x: 0, z: 25, w: 50, h: 5, d: 1 },
            { x: -25, z: 0, w: 1, h: 5, d: 50 },
            { x: 25, z: 0, w: 1, h: 5, d: 50 }
        ];
        walls.forEach(w => {
            const wallGeo = new THREE.BoxGeometry(w.w, w.h, w.d);
            const wall = new THREE.Mesh(wallGeo, wallMaterial);
            wall.position.set(w.x, w.h/2, w.z);
            wall.receiveShadow = true;
            scene.add(wall);
        });
        
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        const fillLight = new THREE.PointLight(0x4466ff, 0.3);
        fillLight.position.set(0, 5, 0);
        scene.add(fillLight);
        
        // ============ ДВИЖЕНИЕ ИГРОКА С ИНВЕРСИЕЙ ============
        const playerSpeed = 0.15;
        
        function updateMovement() {
            let move = { x: 0, z: 0 };
            
            // ИНВЕРСИЯ WASD
            if (invertWASD) {
                if (keyState.w) move.z += 1;
                if (keyState.s) move.z -= 1;
                if (keyState.a) move.x += 1;
                if (keyState.d) move.x -= 1;
            } else {
                if (keyState.w) move.z -= 1;
                if (keyState.s) move.z += 1;
                if (keyState.a) move.x -= 1;
                if (keyState.d) move.x += 1;
            }
            
            if (move.x !== 0 || move.z !== 0) {
                const len = Math.hypot(move.x, move.z);
                move.x /= len;
                move.z /= len;
            }
            
            const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            
            let newX = camera.position.x + (forward.x * move.z + right.x * move.x) * playerSpeed;
            let newZ = camera.position.z + (forward.z * move.z + right.z * move.x) * playerSpeed;
            
            newX = Math.max(-22, Math.min(22, newX));
            newZ = Math.max(-22, Math.min(22, newZ));
            
            camera.position.x = newX;
            camera.position.z = newZ;
        }
        
        // ============ ОБНОВЛЕНИЕ ============
        function update() {
            if (document.getElementById('gameOverScreen').classList.contains('hidden')) {
                updateMovement();
                
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = mouseY;
                
                for (let i = 0; i < enemies.length; i++) {
                    enemies[i].update();
                    
                    const dx = camera.position.x - enemies[i].mesh.position.x;
                    const dz = camera.position.z - enemies[i].mesh.position.z;
                    if (Math.hypot(dx, dz) < 0.8) {
                        takeDamage(15);
                        scene.remove(enemies[i].mesh);
                        enemies.splice(i, 1);
                        i--;
                    }
                }
                
                if (spawnTimer <= 0 && enemies.length < 8) {
                    spawnEnemy();
                    spawnTimer = 60 - Math.min(40, killCount);
                } else {
                    spawnTimer--;
                }
                
                if (invincibleTimer > 0) invincibleTimer--;
                if (shootCooldown > 0) shootCooldown--;
            }
        }
        
        window.addEventListener('click', () => {
            if (document.pointerLockElement === renderer.domElement) {
                shoot();
            }
        });
        
        function animate() {
            update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        animate();
        
        for (let i = 0; i < 3; i++) spawnEnemy();
        updateAmmoUI();
        
        console.log('🎮 Игра запущена! Инверсия мыши: ' + invertMouse + ', инверсия WASD: ' + invertWASD);
    </script>
</body>
</html>
